name: Docs

# Builds the documentation (docs/) and publishes it to GitHub Pages from main.
# Every job runs only in a public repository: a private copy can't usefully publish Pages
# (unavailable on the Free plan, public on paid plans), so there the workflow does nothing.
# Build locally instead:  uv run --group docs sphinx-build -W --keep-going docs build/html

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Build the docs, warnings as errors
        run: uv run --locked --group docs sphinx-build -W --keep-going docs build/html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/html

  deploy:
    needs: build
    if: ${{ !github.event.repository.private && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deploy
        uses: actions/deploy-pages@v4
