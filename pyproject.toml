[build-system]
# The template uses setuptools + setuptools_scm. An editable setuptools build writes into the source
# tree (src/trader.egg-info, the version file), and the strategist's venv is built from the
# deployed checkout, which it can't write. hatch-vcs takes the version from git the same way
# (setuptools_scm) and writes nothing.
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "trader"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
description = "Autonomous Opus day-trading experiment: strategist + Jev classifier runner"
dependencies = [
    "alpaca-py>=0.40",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6",
    "pandas>=2.2",
    "numpy>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
# Transitional: a trading-deploy installed before the dependency groups syncs `--extra dev`. Remove
# once every host has reinstalled trading-deploy (deploy/setup/3-runner.sh install).
dev = ["pytest>=8", "yfinance>=0.2.50"]

[dependency-groups]
# The runtime venvs (the runner's, the strategist's) sync with --no-dev, so they get none of these.
# Running the tests: what trading-deploy's candidate run, trader-test and setup install.
# httpx2: Starlette's TestClient (the dashboard tests) deprecates plain httpx in favour of it.
test = ["httpx2", "pytest>=8", "pytest-cov", "yfinance>=0.2.50"]
# The documentation site (docs/).
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "pydata-sphinx-theme>=0.16",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinxcontrib-mermaid>=1",
    "sphinx-argparse>=0.5",
    "sphinx-autobuild",
]
# Development: everything (`uv sync` installs it by default).
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    "pre-commit",
    "pyright",
    "ruff",
    "tox-uv",
    "types-mock",
]

[project.scripts]
trader = "trader.cli:main"

[project.urls]
GitHub = "https://github.com/gilesknap/jev-trader"

[[project.authors]] # Further authors may be added by duplicating this section
email = "gilesknap@users.noreply.github.com"
name = "Giles Knap"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.uv]
# Rebuild the editable install when the commit changes, so its version follows git.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pyright]
# The template's default is "strict" (or "standard"). This codebase starts at "basic" and moves up as
# the type errors are burned down; the type-checking CI job comes on once it is clean.
typeCheckingMode = "basic"
reportMissingImports = false # Ignore missing stubs in imported modules

[tool.pytest.ini_options]
# Don't spam us with massive tracebacks on error. (The template adds -vv; trading-deploy prints the
# test run, so it stays at pytest's default verbosity here.)
addopts = """
    --tb=native --doctest-modules --doctest-glob="*.rst"
    """
# https://iscinumpy.gitlab.io/post/bound-version-constraints/#watch-for-warnings
filterwarnings = [
    "error",
    # alpaca-py's stream client imports websockets.legacy (third-party; nothing to fix here).
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
]
# Doctest python code in src docstrings, test functions in tests. Not docs (the template's third
# path): it has no .rst, and collecting docs/conf.py would import it, which repoints
# TRADER_DATA_ROOT in os.environ for every later subprocess in the run.
testpaths = "src tests"

[tool.coverage.run]
patch = ["subprocess"]
data_file = "/tmp/trader.coverage"

[tool.coverage.paths]
# Tests are run from installed location, map back to the src directory
source = ["src", "**/site-packages/"]

[tool.tox]
skipsdist = true
# envs to runs automatically with tox -p
env_list = ["pre-commit", "type-checking", "tests", "docs"]

[tool.tox.env_run_base]
# Pass all environment variables to the test environments
passenv = ["*"]

[tool.tox.env.pre-commit]
description = "Run pre-commit on all files"
commands = [
    [
        "pre-commit",
        "run",
        "--all-files",
        "--show-diff-on-failure",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[tool.tox.env.type-checking]
description = "Run pyright"
commands = [
    [
        "pyright",
        "--pythonpath",
        "{env:VIRTUAL_ENV}/bin/python",
        "src",
        "tests",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[tool.tox.env.tests]
description = "Run tests with coverage"
commands = [
    [
        "pytest",
        "--cov=trader",
        "--cov-report",
        "term",
        "--cov-report",
        "xml:cov.xml",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[tool.tox.env.docs]
description = "Run docs build with clean environment"
commands = [
    [
        "sphinx-build",
        "--fresh-env",
        "--show-traceback",
        "--fail-on-warning",
        "--keep-going",
        "docs",
        "build/html",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[tool.tox.env.docs-autobuild]
description = "Run docs with autobuild on change"
commands = [
    [
        "sphinx-autobuild",
        "--show-traceback",
        "--watch",
        "README.md",
        "docs",
        "build/html",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[tool.ruff]
src = ["src", "tests"]
# The template uses 88; this code is written at about 120 columns.
line-length = 120
# Leave the Python examples in Markdown as written.
extend-exclude = ["*.md"]
lint.select = [
    "B",   # flake8-bugbear - https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "C4",  # flake8-comprehensions - https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "E",   # pycodestyle errors - https://docs.astral.sh/ruff/rules/#error-e
    "F",   # pyflakes rules - https://docs.astral.sh/ruff/rules/#pyflakes-f
    "N",   # pep8-naming - https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "W",   # pycodestyle warnings - https://docs.astral.sh/ruff/rules/#warning-w
    "I",   # isort - https://docs.astral.sh/ruff/rules/#isort-i
    "UP",  # pyupgrade - https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "SLF", # self - https://docs.astral.sh/ruff/settings/#lintflake8-self
]

lint.ignore = [
    "N812", # One-letter module aliases (`features as F`, `guardrails as G`, `scoreboard as SB`) are this code's convention
    "N814", # ... and so is `SimpleNamespace as NS`
    "N818", # Exception names are domain words (NotFilled, PartialExit, GuardrailViolation), not "...Error"
]

[tool.ruff.lint.per-file-ignores]
# By default, private member access is allowed in tests
# See https://github.com/DiamondLightSource/python-copier-template/issues/154
# Remove this line to forbid private member access in tests
# E731: one-line lambda stubs are the tests' way of faking a callable.
# C408: dict(...) builds keyword overrides for test specs.
# C420: a comprehension builds a fresh value per key; dict.fromkeys would share one object.
"tests/**/*" = ["SLF001", "E731", "C408", "C420"]
# F811: these import pytest fixtures from another test module and take them as parameters.
"tests/{test_golive_alerts,test_guessed_prices,test_live_week,test_lost_answers,test_missed_demotion}.py" = ["F811"]
# E501: embedded shell scripts, whose lines can't be wrapped.
"tests/{test_strategist_wrapper,test_trading_deploy_split}.py" = ["E501"]
