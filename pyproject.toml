[project]
name = "trader"
version = "0.1.0"
description = "Autonomous Opus day-trading experiment: strategist + Jev classifier runner"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.40",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6",
    "pandas>=2.2",
    "numpy>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "yfinance>=0.2.50"]

[dependency-groups]
# The documentation site (docs/). Not installed by the runtime or the deploy:
#   uv run --group docs sphinx-build -W --keep-going docs build/html
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "pydata-sphinx-theme>=0.16",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinxcontrib-mermaid>=1",
    "sphinx-argparse>=0.5",
]

[project.scripts]
trader = "trader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
